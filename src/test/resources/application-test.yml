spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/contec_pms_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-secret-key-for-contec-pms-integration-tests-0123456789
    expiration-minutes: 60
    issuer: contec-pms

logging:
  level:
    org.springframework.security: WARN
